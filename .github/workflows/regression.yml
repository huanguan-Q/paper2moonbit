name: regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version
      - name: Regression (check + test) across all projects
        run: |
          FAILED=""
          for p in projects/*/; do
            if [ -f "$p/moon.mod" ]; then
              name="$(basename "$p")"
              echo "::group::$name"
              (cd "$p" && moon check >"/tmp/chk_$name.log" 2>&1) && chk=PASS || chk=FAIL
              # lifeguard-mbt is native-only by declared dependency constraints
              # (moonbitlang/async native-stub); moon.pkg declares supported_targets
              if [ "$name" = "lifeguard-mbt" ]; then
                (cd "$p" && moon test --target native >"/tmp/tst_$name.log" 2>&1) && tst=PASS || tst=FAIL
              else
                (cd "$p" && moon test >"/tmp/tst_$name.log" 2>&1) && tst=PASS || tst=FAIL
              fi
              echo "$name: check=$chk test=$tst"
              [ "$chk" = "FAIL" ] && FAILED="$FAILED $name"
              [ "$tst" = "FAIL" ] && FAILED="$FAILED $name"
              echo "::endgroup::"
            fi
          done
          echo "FAILED PROJECTS:$FAILED" | tee /tmp/failed_projects.txt
          if [ -n "$FAILED" ]; then exit 1; fi
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: |
            /tmp/chk_*.log
            /tmp/tst_*.log
            /tmp/failed_projects.txt
          if-no-files-found: ignore
  backend-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Differential test matrix (target ${{ matrix.target }})
        run: |
          for p in projects/chacha-mbt projects/cms-mbt projects/loglog-mbt \
                   projects/chash-mbt projects/sais-mbt projects/codel-mbt \
                   projects/fpcomp-mbt projects/skiplist-mbt projects/crdt-mbt \
                   projects/bwt-mbt projects/roaring-mbt projects/eliasfano-mbt \
                   projects/hyperloglog-mbt projects/xor16filter projects/ziplex-mbt \
                   projects/rqgm-mbt; do
            echo "::group::$(basename "$p") (${{ matrix.target }})"
            (cd "$p" && moon test --target "${{ matrix.target }}") || exit 1
            echo "::endgroup::"
          done
